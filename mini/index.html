<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- script-src 'self' and not 'unsafe-inline': the script lives in
         mini.js so this page can keep a strict policy. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: data:;"
    />
    <title>Music</title>
    <style>
      :root {
        --bg: #161616;
        --fg: #fff;
        --dim: #c4c4c4;
        --accent: #ff0033;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        display: flex;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.3 'Adwaita Sans', Cantarell, Inter, system-ui, sans-serif;
        position: relative;
        overflow: hidden;
        user-select: none;
        cursor: default;
        /* The whole surface drags; the controls opt back out below. */
        -webkit-app-region: drag;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #art {
        position: relative;
        flex: 0 0 auto;
        height: 100%;
        aspect-ratio: 1;
        background-color: #161616;
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      }
      /* Placeholder while nothing is playing, so the tile does not read as a
         broken image. */
      #art.empty {
        background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDY0IDY0Ij48Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIyNy41IiBmaWxsPSJub25lIiBzdHJva2U9IiMzZDNkM2QiIHN0cm9rZS13aWR0aD0iNSIvPjxwYXRoIGQ9Ik0yNi41IDIxbDE2IDExLTE2IDExeiIgZmlsbD0iIzNkM2QzZCIvPjwvc3ZnPg==");
        background-size: 40px 40px;
      }

      #right {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 10px 10px 0 12px;
      }

      #meta { min-width: 0; padding-right: 50px; }
      [hidden] { display: none !important; }
      #title, #artist, #line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #title { font-weight: 700; font-size: 14px; }
      #artist { color: var(--dim); font-size: 12px; margin-top: 2px; }
      #line { font-size: 12px; font-weight: 600; margin-top: 2px; }
      body:not(.has-track) #title { color: var(--dim); font-weight: 400; }

      #row {
        display: flex;
        align-items: center;
        gap: 2px;
        /* Pulled left so the first icon lines up with the title. */
        margin: 0 0 11px -9px;
      }
      #time { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

      button {
        -webkit-app-region: no-drag;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--dim);
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.12); color: var(--fg); }
      button:active { background: rgba(255, 255, 255, 0.2); }
      #like[aria-pressed='true'] { color: var(--accent); }
      #like .on, #like[aria-pressed='true'] .off { display: none; }
      #like[aria-pressed='true'] .on { display: block; }
      button svg { width: 15px; height: 15px; fill: currentColor; pointer-events: none; }
      #playpause { width: 32px; height: 32px; color: #fff; background: var(--accent); margin: 0 3px; }
      #playpause:hover { background: #ff2450; color: #fff; }
      #playpause svg { width: 19px; height: 19px; }
      /* Window buttons sit in the corner, apart from playback. */
      #restore, #quit { position: absolute; top: 6px; width: 22px; height: 22px; }
      #restore { right: 30px; }
      #quit { right: 6px; }
      #restore svg, #quit svg { width: 12px; height: 12px; }
      #quit:hover { background: var(--accent); color: #fff; }

      /* Playback controls go dead when there is nothing to control. Restore and
         close stay live, they are the way out of this window. */
      body:not(.has-track) #previous,
      body:not(.has-track) #playpause,
      body:not(.has-track) #next,
      body:not(.has-track) #like,
      body.ad #like {
        opacity: 0.3;
        pointer-events: none;
      }

      /* Two glyphs per toggle button, the body class decides which one shows. */
      .when-paused, body.playing .when-playing { display: block; }
      .when-playing, body.playing .when-paused { display: none; }

      #bar {
        position: absolute;
        left: 102px;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.22);
      }
      #fill {
        height: 100%;
        width: 0;
        background: var(--accent);
      }
    </style>
  </head>
  <body class="">
    <div id="art" class="empty"></div>
    <div id="right">
      <div id="meta">
        <div id="title">Nothing playing</div>
        <div id="artist"></div>
        <div id="line" hidden></div>
      </div>
      <div id="row">
        <button id="previous" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
        </button>
        <button id="playpause" title="Play / Pause">
          <svg class="when-paused" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          <svg class="when-playing" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
        </button>
        <button id="next" title="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" /></svg>
        </button>
        <button id="like" aria-pressed="false">
          <svg class="off" viewBox="0 0 24 24"><path d="M21 8h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2c0-1.1-.9-2-2-2zm0 4-3 7H9V9l4.34-4.34L12.23 10H21zM1 9h4v12H1z" /></svg>
          <svg class="on" viewBox="0 0 24 24"><path d="M1 21h4V9H1zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73z" /></svg>
        </button>
        <span id="time"></span>
        <!-- Quit really quits: with the main window hidden, closing only this window
             leaves no way out where the tray does not render. -->
        <button id="restore" title="Back to the full window">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 4v10h12V8H6z" /></svg>
        </button>
        <button id="quit" title="Quit Music">
          <svg viewBox="0 0 24 24"><path d="m5.7 4.3 14 14-1.4 1.4-14-14zM18.3 4.3l1.4 1.4-14 14-1.4-1.4z" /></svg>
        </button>
      </div>
    </div>
    <div id="bar"><div id="fill"></div></div>
    <script src="mini.js"></script>
  </body>
</html>
