<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- script-src 'self' and not 'unsafe-inline': the script lives in
         mini.js so this page can keep a strict policy. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: data:;"
    />
    <title>MusicUnofficial</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --fg: #f1f1f1;
        --dim: #a0a0a0;
        --accent: #ff0033;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        display: flex;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        cursor: default;
        /* The whole surface drags; the controls opt back out below. */
        -webkit-app-region: drag;
        border: 1px solid #2a2a2a;
      }

      #art {
        flex: 0 0 auto;
        width: 102px;
        height: 102px;
        background-color: #161616;
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      }
      /* Placeholder while nothing is playing, so the tile does not read as a
         broken image. */
      #art.empty {
        background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDY0IDY0Ij48Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIyNy41IiBmaWxsPSJub25lIiBzdHJva2U9IiMzZDNkM2QiIHN0cm9rZS13aWR0aD0iNSIvPjxwYXRoIGQ9Ik0yNi41IDIxbDE2IDExLTE2IDExeiIgZmlsbD0iIzNkM2QzZCIvPjwvc3ZnPg==");
        background-size: 40px 40px;
      }

      #right {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 11px 8px 0 13px;
      }

      #meta { min-width: 0; }
      #title, #artist {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #title { font-weight: 600; }
      #artist { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
      body:not(.has-track) #title { color: var(--dim); font-weight: 400; }

      #row {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-bottom: 7px;
      }
      #spacer { flex: 1 1 auto; }

      button {
        -webkit-app-region: no-drag;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--dim);
        cursor: pointer;
      }
      button:hover { background: #262626; color: var(--fg); }
      button:active { background: #303030; }
      button svg { width: 15px; height: 15px; fill: currentColor; pointer-events: none; }
      #playpause { color: var(--fg); }
      #playpause svg { width: 19px; height: 19px; }
      #quit:hover { background: var(--accent); color: #fff; }

      /* Playback controls go dead when there is nothing to control. Restore and
         close stay live, they are the way out of this window. */
      body:not(.has-track) #previous,
      body:not(.has-track) #playpause,
      body:not(.has-track) #next {
        opacity: 0.3;
        pointer-events: none;
      }

      /* Two glyphs per toggle button, the body class decides which one shows. */
      .when-paused, body.playing .when-playing { display: block; }
      .when-playing, body.playing .when-paused { display: none; }

      #bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: #242424;
      }
      #fill {
        height: 100%;
        width: 0;
        background: var(--accent);
      }
    </style>
  </head>
  <body class="">
    <div id="art" class="empty"></div>
    <div id="right">
      <div id="meta">
        <div id="title">Nothing playing</div>
        <div id="artist"></div>
      </div>
      <div id="row">
        <button id="previous" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
        </button>
        <button id="playpause" title="Play / Pause">
          <svg class="when-paused" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          <svg class="when-playing" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
        </button>
        <button id="next" title="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" /></svg>
        </button>
        <div id="spacer"></div>
        <!-- Two distinct actions, not two names for one. Quit really quits:
             with the main window hidden behind the mini player, a button that
             only closes this window would leave no way out on a desktop whose
             tray does not actually render. -->
        <button id="restore" title="Back to the full window">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 4v10h12V8H6z" /></svg>
        </button>
        <button id="quit" title="Quit MusicUnofficial">
          <svg viewBox="0 0 24 24"><path d="m5.7 4.3 14 14-1.4 1.4-14-14zM18.3 4.3l1.4 1.4-14 14-1.4-1.4z" /></svg>
        </button>
      </div>
    </div>
    <div id="bar"><div id="fill"></div></div>
    <script src="mini.js"></script>
  </body>
</html>
