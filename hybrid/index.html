<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: data:;"
    />
    <title>Music</title>
    <style>
      :root {
        /* Five greys: ground, surface, raised, hover, pressed. Everything else is white at some strength. */
        --s0: #000;
        --s1: #121212;
        --s2: #1a1a1a;
        --s3: #242424;
        --s4: #2e2e2e;
        --line: rgba(255, 255, 255, 0.08);
        --fg: #fff;
        --fg2: #b3b3b3;
        --fg3: #7a7a7a;
        --accent: #ff0033;
        --font: 'Adwaita Sans', Cantarell, Inter, Ubuntu, system-ui, sans-serif;
        --tint: #3a3a3a;
        /* Native parts (suggestion list, dialog) in dark too. */
        color-scheme: dark;
      }
      /* No scrollbars anywhere; wheel, touchpad and keys still scroll. */
      * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
      html, body { height: 100%; }
      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        background: var(--s0);
        color: var(--fg);
        font: 14px/1.4 var(--font);
        user-select: none;
        overflow: hidden;
      }
      button, input, select { font: inherit; color: inherit; }
      button { border: 0; background: none; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 6px; }
      svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; flex: 0 0 auto; }
      [hidden] { display: none !important; }
      kbd { font: 600 11px/1 var(--font); padding: 4px 7px; border-radius: 5px; background: rgba(255, 255, 255, 0.12); color: var(--fg2); white-space: nowrap; }
      .chip { display: inline-flex; align-items: center; flex: 0 0 auto; padding: 6px 13px; border-radius: 16px; background: rgba(255, 255, 255, 0.08); font-size: 13px; font-weight: 500; white-space: nowrap; }
      .chip:hover { background: rgba(255, 255, 255, 0.14); }
      .chip[aria-selected='true'], .chip[aria-pressed='true'] { background: var(--accent); color: #fff; }
      .chip svg { width: 14px; height: 14px; margin: 0 -4px 0 6px; }
      .panel { background: var(--s1); border-radius: 10px; }
      .round { border-radius: 50% !important; }

      /* Frameless window: the header is the drag handle, everything clickable opts out. */
      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(200px, 480px) minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        padding: 8px 8px 8px 16px;
        -webkit-app-region: drag;
        min-width: 0;
      }
      header button, header input { -webkit-app-region: no-drag; }
      #arrows { display: flex; gap: 8px; }
      #arrows button { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--s1); }
      #arrows button:hover { background: var(--s3); }
      #arrows button[aria-disabled='true'] { color: var(--fg3); background: var(--s1); cursor: default; }
      #search { position: relative; width: 100%; -webkit-app-region: no-drag; }
      #search > svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--fg2); }
      input[type='search'] {
        width: 100%;
        height: 44px;
        padding: 0 44px 0 46px;
        border: 0;
        border-radius: 22px;
        background: var(--s2);
        outline: none;
        font-size: 15px;
      }
      input[type='search']:hover { background: var(--s3); }
      input[type='search']:focus { background: var(--s3); box-shadow: inset 0 0 0 2px var(--fg); }
      input[type='search']::placeholder { color: var(--fg2); }
      input[type='search']::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
      #search-key { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }
      #search:focus-within #search-key, #search.filled #search-key { display: none; }
      #search-clear { position: absolute; right: 8px; top: 50%; display: grid; place-items: center; width: 30px; height: 30px; transform: translateY(-50%); border-radius: 50%; color: var(--fg2); }
      #search-clear:hover { background: var(--s4); color: var(--fg); }
      #search-clear svg { width: 18px; height: 18px; }
      /* Own list instead of the native datalist popup, which ignores the app's look. */
      #suggest {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        z-index: 40;
        padding: 6px;
        border-radius: 12px;
        background: var(--s3);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
      #suggest [role='option'] { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--fg2); }
      #suggest [role='option'] > svg { width: 18px; height: 18px; }
      #suggest [role='option'] span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #suggest [role='option'] b { color: var(--fg); font-weight: 600; }
      #suggest .entity .thumb { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 4px; }
      #suggest .entity .title { color: var(--fg); font-weight: 500; }
      #suggest .entity .sub { font-size: 13px; }
      #suggest .recent-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 4px; color: var(--fg3); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      #suggest .recent-head button { color: var(--fg2); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
      #suggest .recent-head button:hover { color: var(--fg); text-decoration: underline; }
      #suggest .drop-x { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; margin-left: auto; border-radius: 50%; color: var(--fg3); opacity: 0; }
      #suggest [role='option']:hover .drop-x, #suggest [aria-selected='true'] .drop-x { opacity: 1; }
      #suggest .drop-x:hover { background: var(--s4); color: var(--fg); }
      #suggest .drop-x svg { width: 16px; height: 16px; }
      #suggest hr { border: 0; border-top: 1px solid var(--line); margin: 4px 8px; }
      #suggest [role='option']:hover, #suggest [aria-selected='true'] { background: rgba(255, 255, 255, 0.08); }
      #head-right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; }
      #sign-in { flex: 0 0 auto; padding: 8px 16px; border-radius: 18px; white-space: nowrap; color: #000; background: var(--fg); font-weight: 700; }
      #sign-in:hover { background: #d9d9d9; }
      .head-btn { display: grid; place-items: center; flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; color: var(--fg2); }
      .head-btn:hover { color: var(--fg); background: rgba(255, 255, 255, 0.08); }
      #account { width: 36px; height: 36px; padding: 3px; border-radius: 50%; }
      #account:hover { background: var(--s3); }
      #account img { display: block; width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--s4); }
      /* Window buttons as in GNOME's own apps: round, with a light fill. */
      #winctl { display: flex; flex: 0 0 auto; gap: 12px; margin-left: 10px; }
      #winctl button { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); color: var(--fg); }
      #winctl button:hover { background: rgba(255, 255, 255, 0.18); }
      #winctl button:active { background: rgba(255, 255, 255, 0.26); }
      #winctl svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.3; }
      .when-max, html.maximized .when-normal { display: none; }
      html.maximized .when-max { display: block; }
      html.fullscreen header { display: none; }
      /* The big view's panel is the queue alone; a single tab over its own heading said the same twice. */
      body.staged #tab-now, body.staged #tab-lyrics, body.staged #tab-queue { display: none; }
      body.staged #queue-save { margin-left: auto; }
      /* Over the backdrop the solid greys read as slabs; white at low strength lets it through. */
      body.staged .q-now { background: rgba(255, 255, 255, 0.045); }
      body.staged .qrow:hover, body.staged .qrow:focus-visible { background: rgba(255, 255, 255, 0.1); }

      /* Floating surfaces on black, with a gap instead of lines between them. */
      #middle { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; padding: 0 8px; min-height: 0; }
      #middle > * { min-height: 0; }

      #side { grid-column: 1; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; width: 300px; }
      #nav { padding: 8px; }
      .nav-btn { display: flex; align-items: center; gap: 16px; width: 100%; padding: 9px 12px; border-radius: 6px; font-weight: 700; font-size: 15px; color: var(--fg2); text-align: left; }
      .nav-btn:hover, .nav-btn[aria-current='true'] { color: var(--fg); }
      .nav-btn svg { width: 24px; height: 24px; }
      .nav-btn .on, .nav-btn[aria-current='true'] .off { display: none; }
      .nav-btn[aria-current='true'] .on { display: block; }
      #lib { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding-top: 6px; }
      /* Only the list may shrink; the head, chips and tools keep their height. */
      #lib-head, #lib-chips, #lib-tools, #lib-note { flex: 0 0 auto; }
      #lib-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 4px; }
      #lib-new, #side-toggle { color: var(--fg2); }
      #lib-new { margin-left: auto; }
      #side-toggle .unfold, body.rail #side-toggle .fold { display: none; }
      body.rail #side-toggle .unfold { display: block; }
      #lib-chips { display: flex; gap: 8px; padding: 10px 16px 4px; overflow-x: auto; }
      #lib-tools { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px 16px; }
      #lib-filter-box { position: relative; flex: 1 1 auto; min-width: 0; }
      #lib-filter-box svg { position: absolute; left: 8px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--fg2); }
      #lib-filter { width: 100%; height: 30px; padding: 0 8px 0 30px; border: 0; border-radius: 6px; background: transparent; outline: none; font-size: 13px; }
      #lib-filter:focus, #lib-filter:not(:placeholder-shown) { background: var(--s3); }
      #lib-filter::placeholder { color: var(--fg3); }
      #lib-sort { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 4px 6px; border-radius: 6px; color: var(--fg2); font-size: 13px; }
      #lib-sort:hover { color: var(--fg); }
      #lib-sort svg { width: 16px; height: 16px; }
      #lib-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 8px 8px; }
      .lrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
      .lrow:hover { background: var(--s2); }
      .lrow[aria-current='true'] { background: var(--s3); box-shadow: inset 2px 0 0 var(--accent); }
      .lrow .thumb, .lrow .pl-icon { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 4px; }
      .lrow .text { min-width: 0; flex: 1 1 auto; }
      .lrow .title { font-size: 15px; font-weight: 500; }
      .lrow .sub { display: flex; align-items: center; gap: 4px; }
      .lrow .sub svg { width: 14px; height: 14px; color: var(--accent); }
      .fav { background: linear-gradient(135deg, var(--accent), #6b1fd1) !important; color: #fff; }
      #lib-note { padding: 10px 16px; color: var(--fg2); font-size: 13px; }
      #lib-note button { display: block; margin-top: 10px; padding: 6px 14px; border-radius: 16px; background: var(--fg); color: #000; font-weight: 700; }
      /* Narrow windows, or a window that also shows the side panel, keep the library as a strip of covers. */
      body.rail #side { width: 72px; }
      body.rail .nav-btn { justify-content: center; padding: 10px 0; }
      body.rail .nav-btn span, body.rail #lib-new, body.rail #lib-chips, body.rail #lib-tools, body.rail #lib-note, body.rail .lrow .text { display: none; }
      body.rail #lib-head { flex-direction: column; justify-content: center; gap: 2px; padding: 0; }
      body.rail #lib-list { padding: 4px 4px 8px; }
      body.rail .lrow { justify-content: center; padding: 6px 0; }

      main { grid-column: 2; position: relative; overflow-y: auto; border-radius: 10px; background: var(--s1); container-type: inline-size; container-name: page; }
      /* The panel stays neutral; the cover's colour is only a glow behind it. */
      main.has-hero { background: radial-gradient(ellipse 780px 460px at 130px 110px, color-mix(in srgb, var(--tint) 55%, transparent), transparent) var(--s1); background-attachment: local; }
      #inner { max-width: 1440px; margin: 0 auto; padding: 20px 24px 32px; }
      #inner.fade { animation: page-in 180ms ease-out; }
      @keyframes page-in { from { opacity: 0; transform: translateY(6px); } }
      /* The page head's play button and title stay at the top once the head has scrolled away. */
      #sticky {
        position: sticky;
        top: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 64px;
        margin-bottom: -64px;
        padding: 0 24px;
        background: color-mix(in srgb, var(--tint) 18%, var(--s1));
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms;
      }
      #sticky.show { opacity: 1; pointer-events: auto; }
      #sticky b { min-width: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sticky .bigplay { width: 44px; height: 44px; }
      #sticky .bigplay svg { width: 22px; height: 22px; }

      #hero { display: flex; align-items: flex-end; gap: 28px; padding: 40px 24px 28px; }
      #hero-art { flex: 0 0 auto; width: clamp(140px, 26cqi, 232px); aspect-ratio: 1; border-radius: 8px; object-fit: cover; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5); background: var(--s3); }
      #hero-text { min-width: 0; }
      #hero-type { font-size: 13px; font-weight: 600; }
      #hero-title { margin: 6px 0 10px; font-size: clamp(30px, 8cqi, 88px); font-weight: 900; line-height: 1.02; letter-spacing: -0.045em; overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
      #hero-title[data-size='m'] { font-size: clamp(28px, 6.2cqi, 64px); }
      #hero-title[data-size='s'] { font-size: clamp(24px, 4.4cqi, 46px); line-height: 1.08; -webkit-line-clamp: 3; }
      #hero-edition { display: inline-block; margin: 0 0 12px; padding: 4px 11px; border-radius: 14px; background: rgba(255, 255, 255, 0.16); font-size: 13px; font-weight: 700; }
      #hero-desc { max-width: 80ch; color: rgba(255, 255, 255, 0.72); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; user-select: text; }
      #hero-meta { margin-top: 8px; color: rgba(255, 255, 255, 0.85); }
      #hero-meta .who { display: inline-flex; align-items: center; gap: 8px; vertical-align: middle; font-weight: 700; color: #fff; }
      #hero-meta .who img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
      #hero-meta b { color: #fff; font-weight: 700; }
      #hero.artist { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; min-height: clamp(220px, 36vh, 380px); background: var(--s2) center 22% / cover no-repeat; }
      #hero.artist::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.6)); }
      #hero.artist > * { position: relative; }
      #hero.artist #hero-art { display: none; }
      #hero.artist #hero-title { -webkit-line-clamp: 1; }
      #hero-meta .link { font-weight: 700; color: #fff; }
      /* A narrow page stacks the cover over the text. */
      @container page (max-width: 620px) {
        #hero:not(.artist) { flex-direction: column; align-items: flex-start; }
        #hero-art { width: 160px; }
      }

      #tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
      /* Chips stay on one line and page sideways; an edge with more behind it fades out. */
      #chips { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }
      .chip-scroll { display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; overflow-x: auto; }
      .chip-scroll.fade-r { mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); }
      .chip-scroll.fade-l { mask-image: linear-gradient(90deg, transparent, #000 56px); }
      .chip-scroll.fade-l.fade-r { mask-image: linear-gradient(90deg, transparent, #000 56px, #000 calc(100% - 56px), transparent); }
      h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 18px; }
      #actions { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
      .bigplay { display: grid; place-items: center; flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); transition: transform 120ms; }
      .bigplay:hover { transform: scale(1.05); background: #ff2450; }
      .bigplay svg { width: 28px; height: 28px; }
      .act-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--fg2); }
      .act-btn:hover { color: var(--fg); transform: scale(1.05); }
      .act-btn svg { width: 28px; height: 28px; }
      .act-btn[aria-pressed='true'] { color: var(--accent); }
      .act-btn .on, .act-btn[aria-pressed='true'] .off { display: none; }
      .act-btn[aria-pressed='true'] .on { display: block; }
      .subscribe { flex: 0 0 auto; padding: 7px 16px; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--fg3); font-weight: 700; }
      .subscribe:hover { box-shadow: inset 0 0 0 1px var(--fg); }
      .subscribe[aria-pressed='true'] { color: var(--fg2); }
      #list-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--fg2); }
      #list-filter { width: 0; height: 32px; padding: 0; border: 0; border-radius: 6px; background: var(--s3); outline: none; font-size: 13px; transition: width 160ms, padding 160ms; }
      #list-tools.open #list-filter { width: 200px; padding: 0 10px; }
      #list-sort { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 14px; }
      #list-sort:hover { color: var(--fg); }
      #status { color: var(--fg2); margin-bottom: 12px; max-width: 60ch; user-select: text; }
      #status:empty { display: none; }
      #status button { color: var(--fg); text-decoration: underline; }

      section + section { margin-top: 32px; }
      /* Card sizes follow the width of the list, so a row always ends on a whole card. */
      section { container-type: inline-size; }
      .shelf-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
      h2.shelf { flex: 1; min-width: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      .see-all { flex: 0 0 auto; font-size: 13px; font-weight: 700; color: var(--fg2); }
      .see-all:hover { color: var(--fg); text-decoration: underline; }
      .pager { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); }
      .pager:hover { background: rgba(255, 255, 255, 0.16); }
      .pager[aria-disabled='true'] { opacity: 0.35; cursor: default; background: rgba(255, 255, 255, 0.08); }

      .thumb { display: block; width: 100%; height: 100%; border-radius: 4px; object-fit: cover; background: var(--s3); opacity: 0; transition: opacity 240ms; }
      .thumb.in { opacity: 1; }
      .pl-icon { display: grid; place-items: center; background: var(--s3); color: var(--fg2); }
      .text { min-width: 0; }
      .title, .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub { color: var(--fg2); font-size: 13px; }
      .link { cursor: pointer; }
      .link:hover { color: var(--fg); text-decoration: underline; }
      .ex { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: 6px; border-radius: 3px; background: var(--fg2); color: #000; font-size: 10px; font-weight: 700; vertical-align: 1px; }

      /* Plain rows: search results and mixed lists. */
      .item {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) auto 32px;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        /* Rows far off screen skip layout and paint, which keeps long lists light to scroll. */
        content-visibility: auto;
        contain-intrinsic-size: auto 60px;
      }
      .item .extra { color: var(--fg2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .item:hover, .item:focus-visible, .trow:hover, .trow:focus-visible { background: rgba(255, 255, 255, 0.07); }
      .item.selected, .trow.selected, .tile.selected { background: rgba(255, 255, 255, 0.15); }
      .item.current .title, .trow.current .title, .tile.current .title { color: var(--accent); }
      .cover { position: relative; width: 48px; height: 48px; }
      .cover .index { display: grid; place-items: center; height: 100%; color: var(--fg2); font-variant-numeric: tabular-nums; }
      .more { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--fg2); opacity: 0; }
      .item:hover .more, .item:focus-within .more, .trow:hover .more, .trow:focus-within .more, .tile:hover .more { opacity: 1; }
      .more:hover { color: var(--fg); }
      /* Play a playlist or album straight from its cover, without opening it. */
      .cover-play { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 4px; background: rgba(0, 0, 0, 0.5); color: #fff; opacity: 0; transition: opacity 120ms; }
      .item:hover .cover-play, .cover-play:focus-visible { opacity: 1; }
      /* The playing track's bars on its cover, in rows and on cards alike. */
      .cover .playing { display: none; position: absolute; inset: 0; place-items: center; border-radius: 4px; background: rgba(0, 0, 0, 0.55); }
      .cover .playing .eq { display: flex; }
      .current > .cover .playing { display: grid; }
      .tile .cover .playing { inset: auto auto 8px 8px; width: 36px; height: 28px; border-radius: 14px; background: rgba(0, 0, 0, 0.72); }
      .cover .dur { position: absolute; right: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: rgba(0, 0, 0, 0.8); color: #fff; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
      /* Music videos in their own wide frame. */
      .item.wide { grid-template-columns: 85px minmax(0, 1fr) auto 32px; }
      .item.wide .cover { width: 85px; }
      .tile.wide .cover { aspect-ratio: 16 / 9; }
      .trow.wide .tt .cover { width: 71px; }

      /* Track lists as a table: number, title, album or plays, rating, length. */
      .table { --cols: 32px minmax(0, 1fr) 32px; }
      .thead, .trow { display: grid; grid-template-columns: var(--cols); align-items: center; gap: 16px; padding: 0 12px; }
      .thead { position: sticky; top: var(--sticky-h, 0px); z-index: 3; height: 36px; margin-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--fg2); font-size: 13px; transition: background 160ms; }
      main.stuck .thead, main:not(.has-hero) .thead { background: var(--s1); }
      .thead .r, .trow .r { text-align: right; justify-self: end; }
      .thead svg { width: 16px; height: 16px; }
      .trow { height: 56px; border-radius: 6px; cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 56px; }
      .trow .n { display: flex; justify-content: flex-end; color: var(--fg2); font-size: 15px; font-variant-numeric: tabular-nums; }
      .trow .n svg { display: none; width: 18px; height: 18px; color: var(--fg); }
      .trow:hover .n em, .trow:focus-visible .n em { display: none; }
      .trow:hover .n svg, .trow:focus-visible .n svg { display: block; }
      .trow .n em { font-style: normal; }
      .trow.current .n em, .trow.current:hover .n svg { display: none; }
      .trow .eq { display: none; }
      .trow.current .eq { display: flex; }
      .tt { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .tt .cover { width: 40px; height: 40px; flex: 0 0 auto; }
      .tt .title { font-size: 15px; }
      /* Album tracks on one line: the artist only where it is not the album's own. */
      .trow.solo { height: 44px; contain-intrinsic-size: auto 44px; }
      .trow.solo .text { display: flex; align-items: baseline; gap: 10px; }
      .trow.solo .title { flex: 0 1 auto; min-width: 0; }
      .trow.solo .sub { flex: 0 10 auto; min-width: 0; }
      /* Narrow lists drop the album and plays columns before the title gets cut. */
      @container (max-width: 640px) {
        .table .thead, .table .trow { grid-template-columns: var(--cols-narrow); }
        .table .col-album, .table .col-extra { display: none; }
      }
      .trow .col { min-width: 0; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      .rate { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--fg2); opacity: 0; }
      .rate:hover { color: var(--fg); }
      .rate .on, .rate[aria-pressed='true'] .off { display: none; }
      .rate[aria-pressed='true'] { opacity: 1; color: var(--fg2); }
      .trow:hover .rate[aria-pressed='true'] { color: var(--fg); }
      .rate[aria-pressed='true'] .on { display: block; }
      .trow:hover .rate, .trow:focus-within .rate { opacity: 1; }
      .eq { align-items: flex-end; gap: 2px; height: 14px; }
      .eq i { width: 3px; height: 100%; background: var(--accent); transform-origin: bottom; animation: eq 0.9s ease-in-out infinite alternate; }
      .eq i:nth-child(2) { animation-delay: -0.3s; }
      .eq i:nth-child(3) { animation-delay: -0.6s; }
      body:not(.playing) .eq i { animation-play-state: paused; }
      @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }

      /* Inline padding is half the gap, which makes one page of cards exactly clientWidth wide. */
      .tiles, .grid { --n: 2; --gap: 8px; display: grid; gap: var(--gap); padding: 0 calc(var(--gap) / 2) 4px; margin: 0 -10px; }
      @container (min-width: 520px) { .tiles, .grid { --n: 3; } }
      @container (min-width: 720px) { .tiles, .grid { --n: 4; } }
      @container (min-width: 920px) { .tiles, .grid { --n: 5; } }
      @container (min-width: 1160px) { .tiles, .grid { --n: 6; } }
      @container (min-width: 1360px) { .tiles, .grid { --n: 7; } }
      /* A shelf pages sideways with its arrows; wheel and touchpad still scroll it. */
      .tiles {
        grid-auto-flow: column;
        grid-auto-columns: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
        overflow-x: auto;
        scroll-padding-inline: calc(var(--gap) / 2);
        scroll-snap-type: x proximity;
      }
      .grid { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); row-gap: 8px; }
      .tile { position: relative; min-width: 0; padding: 10px; border-radius: 8px; cursor: pointer; scroll-snap-align: start; transition: background 150ms; }
      .tile:hover, .tile:focus-visible { background: var(--s2); }
      .tile .cover { width: 100%; height: auto; aspect-ratio: 1; margin-bottom: 10px; }
      .tile .thumb { border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
      .tile.round .thumb { border-radius: 50%; }
      .tile .title { font-weight: 700; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .tile .sub { margin-top: 2px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      /* A round button that rises out of the cover's corner, instead of a veil over the whole cover. */
      .tile .cover-play, .qt .cover-play {
        inset: auto 8px 8px auto;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.45);
        transform: translateY(8px);
        transition: opacity 200ms, transform 200ms;
      }
      .tile .cover-play svg { width: 24px; height: 24px; }
      .tile:hover .cover-play, .tile:focus-visible .cover-play { opacity: 1; transform: none; }
      .tile .more { position: absolute; top: 16px; right: 16px; background: rgba(0, 0, 0, 0.6); color: #fff; }

      /* Quick access on top of home: wide tiles that play with one click. */
      .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; }
      .qt { position: relative; display: flex; align-items: center; gap: 12px; height: 56px; padding-right: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); overflow: hidden; cursor: pointer; transition: background 150ms; }
      .qt:hover, .qt:focus-visible { background: rgba(255, 255, 255, 0.16); }
      .qt .cover { width: 56px; height: 56px; flex: 0 0 auto; }
      .qt .thumb { border-radius: 0; }
      .qt .title { flex: 1 1 auto; min-width: 0; font-weight: 700; }
      .qt .cover-play { position: static; flex: 0 0 auto; width: 34px; height: 34px; transform: none; }
      .qt .cover-play svg { width: 20px; height: 20px; }
      .qt:hover .cover-play, .qt:focus-visible .cover-play { opacity: 1; }

      /* Search: the top result as a card, its tracks beside it. */
      .topgrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 24px; }
      .topgrid h2 { margin-bottom: 10px; }
      .topres { position: relative; padding: 20px; border-radius: 8px; background: var(--s2); cursor: pointer; transition: background 150ms; }
      .topres:hover, .topres:focus-visible { background: var(--s3); }
      .topres .cover { width: 96px; height: 96px; }
      .topres .thumb { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
      .topres .name { margin: 18px 0 8px; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; overflow-wrap: anywhere; }
      .topres .sub { white-space: normal; }
      .topres.tinted { background: linear-gradient(160deg, color-mix(in srgb, var(--tint) 62%, #000), color-mix(in srgb, var(--tint) 26%, #000)); }
      .topres.tinted:hover { background: linear-gradient(160deg, color-mix(in srgb, var(--tint) 72%, #000), color-mix(in srgb, var(--tint) 32%, #000)); }
      .topres.tinted .sub { color: rgba(255, 255, 255, 0.78); }
      .top-acts { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 14px; }
      .top-acts .bigplay { width: 50px; height: 50px; }
      .top-acts .bigplay svg { width: 26px; height: 26px; }
      .topres .subscribe { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
      @media (max-width: 899px) { .topgrid { grid-template-columns: minmax(0, 1fr); } }

      /* About an artist, at the end of the page. */
      #about { margin-top: 40px; }
      #about h2 { margin-bottom: 12px; }
      .about-card { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 24px; padding: 18px; border-radius: 10px; background: var(--s2); }
      .about-card img { width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; object-fit: cover; object-position: center 22%; background: var(--s3); }
      .about-text { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
      .about-text b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      .about-text p { max-width: 75ch; color: var(--fg2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; user-select: text; }
      .about-text p.open { display: block; }
      .about-text button { font-size: 13px; font-weight: 700; }
      .about-text button:hover { text-decoration: underline; }
      @container page (max-width: 620px) { .about-card { grid-template-columns: minmax(0, 1fr); } }

      .empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 48px 16px; text-align: center; }
      .empty svg { width: 44px; height: 44px; color: var(--fg3); margin-bottom: 8px; }
      .empty b { font-size: 18px; font-weight: 700; }
      .empty p { max-width: 42ch; color: var(--fg2); }
      .empty button { margin-top: 12px; padding: 8px 18px; border-radius: 18px; background: var(--fg); color: #000; font-weight: 700; }

      /* Placeholders in the shape of what is loading. */
      .sk { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--s2) 0, var(--s3) 50%, var(--s2) 100%) 0 0 / 200% 100%; animation: sk 1.4s linear infinite; }
      @keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }
      .skel { display: grid; gap: 14px; }
      .skel .sk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
      .skel .sk-card .sk { aspect-ratio: 1; }
      .skel .sk-card .sk + .sk { aspect-ratio: auto; height: 12px; width: 70%; margin-top: 10px; }
      .skel .sk-row { display: flex; align-items: center; gap: 12px; }
      .skel .sk-row > .sk { width: 40px; height: 40px; flex: 0 0 auto; }
      .skel .sk-row div { flex: 1; display: grid; gap: 6px; }
      .skel .ln { height: 11px; }

      #menu, #submenu {
        position: fixed;
        z-index: 50;
        min-width: 240px;
        max-width: 320px;
        max-height: calc(100vh - 16px);
        overflow-y: auto;
        padding: 6px;
        border-radius: 10px;
        background: var(--s3);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
      #submenu { z-index: 51; }
      #menu button, #submenu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; white-space: nowrap; }
      #menu button > svg, #submenu button > svg { width: 18px; height: 18px; color: var(--fg2); }
      #menu button span, #submenu button span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      #menu button:hover, #menu button:focus-visible, #menu button.open, #submenu button:hover, #submenu button:focus-visible { background: rgba(255, 255, 255, 0.1); outline: none; }
      #menu .head { padding: 8px 10px 10px; color: var(--fg2); font-size: 13px; }
      #menu .head b { display: block; color: var(--fg); font-size: 14px; }
      #menu hr, #submenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
      #submenu .thumb, #submenu .pl-icon { width: 26px; height: 26px; flex: 0 0 auto; }

      dialog {
        margin: auto;
        width: min(420px, 90vw);
        max-height: 70vh;
        overflow: hidden;
        padding: 20px 12px 12px;
        border: 0;
        border-radius: 12px;
        background: var(--s2);
        color: var(--fg);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
      dialog h2 { font-size: 18px; margin: 0 8px 12px; }
      #pl-status { color: var(--fg2); margin: 0 8px 12px; }
      #pl-status:empty { display: none; }
      /* Only the list scrolls, the title and buttons stay. */
      #pl-dialog[open] { display: flex; flex-direction: column; }
      #pl-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      #pl-list button, #pl-create { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
      #pl-list button:hover, #pl-create:hover { background: var(--s3); }
      #pl-list .thumb, #pl-dialog .pl-icon { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 6px; }
      #pl-list .sub { font-size: 12px; }
      #pl-create { margin-top: 4px; }
      #ask-input { display: block; width: calc(100% - 16px); margin: 0 8px 16px; padding: 8px 10px; border: 0; border-radius: 6px; background: var(--s3); color: var(--fg); }
      /* OK comes first in the markup, so Enter in the field confirms; shown on the right. */
      #ask-buttons { display: flex; flex-direction: row-reverse; gap: 8px; margin: 0 8px; }
      #ask-buttons button, #pl-cancel, .btn { padding: 7px 16px; border-radius: 18px; background: var(--s3); font-weight: 600; }
      #ask-buttons button:hover, #pl-cancel:hover, .btn:hover { background: var(--s4); }
      #ask-buttons button[value='ok'], .btn.primary { background: var(--fg); color: #000; }
      #ask-buttons button[value='ok']:hover, .btn.primary:hover { background: #d9d9d9; }
      #pl-cancel { display: block; margin: 12px 8px 0 auto; }
      #up-dialog { width: min(440px, 90vw); padding: 24px; }
      #keys-dialog { width: min(720px, 92vw); max-height: 86vh; padding: 22px 24px; background: var(--s3); }
      /* The box takes the focus itself when it opens; it needs no ring. */
      #keys-dialog:focus-visible { outline: none; }
      #keys-dialog h2 { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; font-size: 22px; font-weight: 800; }
      #keys-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
      .kr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; color: var(--fg2); }
      .kr kbd { color: var(--fg); background: var(--s4); font-size: 12px; }
      @media (max-width: 640px) { #keys-cols { grid-template-columns: minmax(0, 1fr); } }
      #up-dialog h2 { margin: 0 0 2px; font-size: 20px; }
      #up-version { color: var(--fg2); font-size: 13px; margin: 0 0 16px; }
      #up-text { margin: 0; line-height: 1.45; }
      #up-bar { display: block; width: 100%; height: 4px; margin: 14px 0 0; border: 0; border-radius: 2px; -webkit-appearance: none; appearance: none; }
      #up-bar::-webkit-progress-bar { background: var(--s3); border-radius: 2px; }
      #up-bar::-webkit-progress-value { background: var(--accent); border-radius: 2px; transition: width 0.2s; }
      #up-bar:indeterminate::-webkit-progress-bar { background: linear-gradient(90deg, var(--s3) 35%, var(--accent) 50%, var(--s3) 65%) 0 0 / 300% 100%; animation: up-slide 1.4s linear infinite; }
      @keyframes up-slide { from { background-position: 100% 0; } to { background-position: 0 0; } }
      #up-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      #up-bar[hidden], #up-actions[hidden] { display: none; }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 104px;
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: min(520px, 90vw);
        padding: 8px 16px;
        transform: translateX(-50%);
        border-radius: 10px;
        background: var(--fg);
        color: #000;
        font-weight: 500;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
        animation: toast-in 180ms ease-out;
      }
      #toast.has-art { padding-left: 8px; }
      #toast img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; flex: 0 0 auto; }
      #toast span { min-width: 0; }
      #toast button { flex: 0 0 auto; margin-left: 8px; font-weight: 700; }
      #toast button:hover { text-decoration: underline; }
      @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
      #tip {
        position: fixed;
        z-index: 70;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 320px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--s4);
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }

      /* The panel on the right: what plays, up next and lyrics. */
      #queue {
        grid-column: 3;
        width: 340px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: queue-in 160ms ease-out;
      }
      @keyframes queue-in { from { opacity: 0; transform: translateX(12px); } }
      #queue-head { display: flex; align-items: center; gap: 6px; padding: 12px 10px 8px 12px; }
      .queue-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--fg2); flex: 0 0 auto; }
      .queue-icon:hover { background: var(--s3); color: var(--fg); }
      .queue-icon svg { width: 18px; height: 18px; }
      #queue-save { margin-left: auto; }
      #queue-pane, #now-pane { display: flex; flex-direction: column; min-height: 0; }
      #queue-list, #lyrics-pane, #now-pane { overflow-y: auto; }
      #queue-list { padding: 4px 8px 12px; }
      #lyrics-pane { padding: 10px 20px 28px; user-select: text; }
      #lyrics { white-space: pre-line; font-size: 17px; font-weight: 700; line-height: 1.7; }
      #lyrics-source { color: var(--fg2); font-size: 12px; margin-top: 18px; }
      #queue-empty { color: var(--fg2); padding: 14px 20px 0; }
      .qrow {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) auto 28px;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        text-align: left;
        cursor: pointer;
      }
      .qrow:hover, .qrow:focus-visible { background: var(--s3); }
      .qrow .drop { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--fg2); opacity: 0; }
      .qrow:hover .drop, .qrow:focus-within .drop { opacity: 1; }
      .qrow .drop:hover { background: var(--s4); color: var(--fg); }
      .qrow .drop svg { width: 16px; height: 16px; }
      .qrow.dragging { opacity: 0.4; }
      .qrow.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
      .qrow.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
      .qrow .cover { width: 40px; height: 40px; }
      .qrow .len { color: var(--fg2); font-size: 13px; font-variant-numeric: tabular-nums; }
      .qrow[aria-current='true'] .title { color: var(--accent); }
      .qrow .eq { display: flex; justify-self: end; margin-right: 6px; }
      /* The queue in parts: the playing track on its own surface, then up next, then autoplay. */
      .q-now { margin: 2px 0 4px; border-radius: 8px; background: var(--s2); }
      .qsec { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 8px 4px; }
      .qsec > :first-child { font-weight: 700; font-size: 15px; }
      .qsec > :last-child { color: var(--fg2); font-size: 12px; font-variant-numeric: tabular-nums; }
      .qsec.auto { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
      .qrow.auto { opacity: 0.65; }
      .qrow.auto:hover, .qrow.auto:focus-visible { opacity: 1; }
      #now-pane { padding: 4px 16px 16px; gap: 14px; }
      /* At most about a third of the window's height, so up next stays in view. */
      #np-art { display: block; width: min(100%, 36vh); align-self: center; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: var(--s3); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); cursor: pointer; }
      #np-meta { display: flex; align-items: center; gap: 4px; }
      #np-meta .text { flex: 1 1 auto; }
      #np-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #np-artist { font-size: 14px; }
      #np-next { padding: 10px 6px 4px; border-radius: 10px; background: var(--s2); }
      #np-next-head { display: flex; justify-content: space-between; padding: 0 8px 4px; font-size: 13px; }
      #np-next-head b { font-weight: 700; }
      #np-next-head button { color: var(--fg2); }
      #np-next-head button:hover { color: var(--fg); text-decoration: underline; }
      #np-artist-card { flex: 0 0 auto; border-radius: 10px; overflow: hidden; background: var(--s2); cursor: pointer; }
      .ac-photo { position: relative; display: flex; align-items: flex-end; height: 104px; padding: 10px 12px; background: var(--s3) center 22% / cover no-repeat; }
      .ac-photo::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0, 0, 0, 0.65)); }
      .ac-photo b { position: relative; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
      .ac-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; }
      .ac-foot .subscribe { padding: 5px 12px; font-size: 13px; }
      #np-artist-card:hover .ac-photo b { text-decoration: underline; }
      @media (max-width: 899px) {
        #queue { position: absolute; top: 0; bottom: 0; right: 8px; z-index: 10; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); }
      }

      /* The now-playing view: blurred cover behind, the cover or video, lyrics beside it. */
      #stage { grid-column: 2; position: relative; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); overflow: hidden; border-radius: 10px; }
      #stage-top { position: relative; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px 24px; }
      #stage-label { flex: 0 1 auto; min-width: 0; margin-right: auto; font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, 0.8); text-align: left; cursor: default; }
      #stage-label.from { display: grid; cursor: pointer; }
      #stage-label small { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); }
      #stage-label b { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #stage-label.from:hover b { text-decoration: underline; }
      #stage-top .queue-icon { color: #fff; }
      #stage-body { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; min-height: 0; padding: 8px 56px 32px; }
      #stage-song { display: flex; flex-direction: column; justify-content: center; min-height: 0; height: 100%; }
      #stage-art { display: block; width: min(100%, 440px, 52vh); aspect-ratio: 1; border-radius: 10px; object-fit: cover; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
      #stage-title { margin-top: 22px; font-size: 32px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; }
      #stage-artist { margin-top: 4px; font-size: 17px; color: rgba(255, 255, 255, 0.75); }
      #stage-lyrics { max-height: 100%; overflow-y: auto; padding: 24px 0; white-space: pre-line; font-size: 28px; font-weight: 800; line-height: 1.45; letter-spacing: -0.01em; color: rgba(255, 255, 255, 0.86); user-select: text; mask-image: linear-gradient(transparent, #000 24px, #000 calc(100% - 48px), transparent); }
      #stage-lyrics.none { font-size: 17px; font-weight: 600; color: rgba(255, 255, 255, 0.6); }
      /* Timed lyrics: the line being sung lights up, those sung fade back; a click plays from a line. */
      .synced { white-space: normal; }
      .synced p { margin: 0 0 6px; color: rgba(255, 255, 255, 0.55); cursor: pointer; transition: color 220ms, transform 220ms; transform-origin: left center; }
      .synced p.past { color: rgba(255, 255, 255, 0.25); }
      .synced p.now { color: #fff; transform: scale(1.04); }
      /* A pause without words: three dots that pulse while it lasts. */
      .synced p.gap { display: flex; gap: 0.3em; padding: 0.35em 0; }
      .synced p.gap i { width: 0.36em; height: 0.36em; border-radius: 50%; background: currentColor; }
      .synced p.gap.now i { animation: gap 1.2s ease-in-out infinite; }
      .synced p.gap.now i:nth-child(2) { animation-delay: 0.2s; }
      .synced p.gap.now i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes gap { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: none; } }
      .synced p:hover { color: rgba(255, 255, 255, 0.85); }
      #stage-lyrics.synced { color: inherit; }
      #stage-video { display: none; }
      /* A music video as large as the view allows, at its own aspect, so no black bars show. */
      #stage.video #stage-body { display: flex; align-items: center; justify-content: center; padding: 0 12px 12px; }
      #stage.video #stage-song, #stage.video #stage-lyrics { display: none; }
      #stage.video #stage-video { display: block; flex: 0 0 auto; width: 640px; height: 360px; background: #000; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55); }
      #av { display: flex; flex: 0 0 auto; padding: 3px; border-radius: 16px; background: rgba(0, 0, 0, 0.35); }
      #av button { padding: 5px 14px; border-radius: 13px; font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.75); }
      #av button[aria-pressed='true'] { background: #fff; color: #000; }
      @media (max-width: 899px) {
        #stage-body { grid-template-columns: minmax(0, 1fr); padding: 8px 24px 24px; }
        #stage-lyrics { display: none; }
      }

      /* While the big view is open its blurred cover lies behind the whole window. */
      #backdrop { display: none; position: fixed; inset: -12%; width: 124%; height: 124%; object-fit: cover; filter: blur(72px) saturate(1.35) brightness(0.45); pointer-events: none; }
      body.staged #backdrop[src] { display: block; }
      body.staged header, body.staged footer { position: relative; }
      body.staged .panel { background: rgba(0, 0, 0, 0.28); }
      body.staged footer { background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.35)); }
      body.staged #arrows button, body.staged input[type='search'] { background: rgba(0, 0, 0, 0.3); }
      body.staged #fill { background: var(--fg); }

      /* Registered so the tint can fade between tracks; a plain custom property would snap. */
      @property --cover {
        syntax: '<color>';
        inherits: false;
        initial-value: #000;
      }
      /* The one loud thing: the cover's own colour runs out of it into the bar. */
      footer {
        --cover: #000;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 620px) minmax(0, 1fr);
        align-items: center;
        gap: 16px;
        height: 84px;
        padding: 0 16px;
        background: linear-gradient(90deg, color-mix(in srgb, var(--cover) 40%, transparent), color-mix(in srgb, var(--cover) 10%, transparent) 36%, transparent 64%), var(--s0);
        transition: --cover 600ms;
      }
      #left { display: flex; align-items: center; gap: 8px; min-width: 0; }
      #now { display: flex; align-items: center; gap: 12px; min-width: 0; }
      #art-btn { position: relative; flex: 0 0 auto; width: 56px; height: 56px; padding: 0; border-radius: 4px; overflow: hidden; }
      #art { width: 100%; height: 100%; background: var(--s3) center / cover no-repeat; }
      /* Says that the cover opens the big view. */
      #art-btn > svg { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 2px; border-radius: 50%; background: rgba(0, 0, 0, 0.7); color: #fff; opacity: 0; transition: opacity 120ms; }
      #art-btn:hover > svg, #art-btn:focus-visible > svg { opacity: 1; }
      #meta { min-width: 0; }
      #title { overflow: hidden; white-space: nowrap; cursor: pointer; font-weight: 600; }
      #title span { display: inline-block; }
      #title:not(.scroll) span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
      /* A title too long for its box runs through once while hovered. */
      #title.scroll span { animation: marquee var(--mq-time, 6s) linear 400ms 1 both; }
      @keyframes marquee { 0%, 8% { transform: none; } 92%, 100% { transform: translateX(var(--mq, 0px)); } }
      /* A notch lighter than the dim grey: it sits on the strongest part of the tint. */
      #artist { color: #bdbdbd; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      body:not(.has-track) #title { color: var(--fg2); font-weight: 400; }
      body:not(.has-track) #like { visibility: hidden; }

      .icon-btn { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--fg2); flex: 0 0 auto; }
      .icon-btn:hover { color: var(--fg); }
      .icon-btn[aria-pressed='true'] { color: var(--accent); }
      /* State is a dot as well as a colour. */
      .toggle[aria-pressed='true']::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
      /* Thumbs as in YouTube Music: outlined until rated, filled once rated. */
      .icon-btn .on, .icon-btn[aria-pressed='true'] .off { display: none; }
      .icon-btn[aria-pressed='true'] .on { display: block; }
      #like[aria-pressed='true'] { color: var(--fg); }
      #like.pop svg, .rate.pop svg { animation: pop 350ms ease-out; }
      @keyframes pop { 40% { transform: scale(1.35) rotate(-12deg); } }
      #center { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
      #controls { display: flex; align-items: center; gap: 12px; }
      #controls .main { color: var(--fg); }
      #playpause { width: 36px; height: 36px; margin: 0 4px; background: var(--fg) !important; color: #000 !important; transition: transform 120ms; }
      #playpause:hover { transform: scale(1.06); }
      #playpause svg { position: absolute; width: 22px; height: 22px; transition: opacity 180ms, transform 180ms; }
      .when-playing, body.playing .when-paused { opacity: 0; transform: rotate(-90deg) scale(0.4); }
      .when-paused, body.playing .when-playing { opacity: 1; transform: none; }
      body:not(.has-track) #controls button,
      body:not(.has-track) #progress,
      body:not(.has-track) #like,
      body.ad #like { opacity: 0.35; pointer-events: none; }
      #progress { display: flex; align-items: center; gap: 8px; width: 100%; color: var(--fg2); font-size: 12px; font-variant-numeric: tabular-nums; }
      #progress span { flex: 0 0 auto; min-width: 36px; }
      #t-pos { text-align: right; }

      #right { display: flex; align-items: center; justify-content: flex-end; gap: 2px; min-width: 0; }
      #right .icon-btn[aria-pressed='true'] { color: var(--accent); }
      #mute svg { display: none; }
      #mute[data-level='0'] .v0, #mute[data-level='1'] .v1, #mute[data-level='2'] .v2, #mute[data-level='3'] .v3 { display: block; }
      #volume {
        --vol: 100%;
        -webkit-appearance: none;
        appearance: none;
        width: 92px;
        height: 16px;
        margin-right: 6px;
        background: transparent;
        cursor: pointer;
      }
      #volume::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--vol-fill, var(--fg)) var(--vol), rgba(255, 255, 255, 0.2) var(--vol)); }
      #volume::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--fg); opacity: 0; }
      #volume:hover, #volume:focus-visible { --vol-fill: var(--accent); }
      #volume:hover::-webkit-slider-thumb, #volume:focus-visible::-webkit-slider-thumb { opacity: 1; }
      #volume:focus-visible { outline: none; }

      /* Drawn by #rail/#fill/#glide, driven by an invisible native range on top:
         that one brings dragging and arrow-key steps of a second. The fill and the
         knob sit on a layer of their own, so each pixel step is composited, not repainted. */
      #seekbar { position: relative; flex: 1 1 auto; height: 14px; }
      #rail { position: absolute; left: 0; right: 0; top: 5px; height: 4px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, 0.2); }
      #fill, #glide { position: absolute; inset: 0; transform: translateX(-100%); will-change: transform; }
      #fill { background: var(--accent); }
      #glide { pointer-events: none; }
      #glide::after {
        content: '';
        position: absolute;
        right: -6px;
        top: 1px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--fg);
        transform: scale(0);
        transition: transform 120ms;
      }
      #seekbar:hover #glide::after, #seekbar.scrubbing #glide::after, #seekbar:has(#seek:focus-visible) #glide::after { transform: scale(1); }
      #seek {
        -webkit-appearance: none;
        appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }
      #seek:focus-visible { outline: none; }
      #seek::-webkit-slider-runnable-track { height: 100%; background: transparent; }
      /* 1 px wide, so a click lands where it points and not half a knob off. */
      #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: 100%; background: transparent; }
      #seek:disabled { pointer-events: none; }
      #seek-tip {
        position: absolute;
        bottom: 18px;
        left: 0;
        transform: translateX(-50%);
        padding: 3px 7px;
        border-radius: 4px;
        background: var(--s4);
        color: var(--fg);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: nowrap;
      }

      .settings { max-width: 720px; display: grid; gap: 8px; }
      .settings h2 { font-size: 18px; font-weight: 800; margin: 18px 0 4px; scroll-margin-top: 60px; }
      /* Jumps to each part, and stays at the top while the page scrolls. */
      .set-jump { position: sticky; top: 0; z-index: 4; display: flex; gap: 8px; overflow-x: auto; margin: -8px 0 0; padding: 8px 0 10px; background: var(--s1); }
      .settings h2:first-child { margin-top: 0; }
      .set-group { padding: 0 16px; border-radius: 10px; background: var(--s2); }
      .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; }
      .set-row + .set-row, .set-group > * + * { border-top: 1px solid var(--line); }
      .set-row label { flex: 1; cursor: pointer; }
      .set-row .note, .settings .note { color: var(--fg2); font-size: 13px; margin-top: 2px; }
      .set-group > .note { padding: 12px 0; margin: 0; }
      .kbd { color: var(--fg2); font-size: 13px; white-space: nowrap; }
      .settings select, .settings input[type='text'], .settings input[type='password'] {
        min-width: 220px;
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: var(--s4);
        color: var(--fg);
        font: inherit;
      }
      /* Switches instead of tick boxes. */
      .settings input[type='checkbox'] { -webkit-appearance: none; appearance: none; position: relative; flex: 0 0 auto; width: 38px; height: 22px; border-radius: 11px; background: #555; cursor: pointer; transition: background 200ms; }
      .settings input[type='checkbox']::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 200ms; }
      .settings input[type='checkbox']:checked { background: var(--accent); }
      .settings input[type='checkbox']:checked::after { transform: translateX(16px); }
      .settings .actions { display: flex; gap: 8px; align-items: center; padding: 12px 0; }
      .settings .link { color: var(--fg); text-decoration: underline; }

      #skip-ad { flex: 0 0 auto; padding: 6px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.14); white-space: nowrap; }
      #skip-ad:hover { background: rgba(255, 255, 255, 0.24); }

      /* Below 1280 px the controls give up some width and the album goes, so the title stays whole. */
      @media (max-width: 1279px) {
        footer { grid-template-columns: minmax(0, 1.3fr) minmax(0, 440px) minmax(0, 1fr); }
        #artist .alb { display: none; }
      }
      /* The slider goes first; mute and the +/- keys still set the volume. */
      @media (max-width: 899px) { #volume { display: none; } }
      @media (max-width: 760px) {
        #volume, #lyrics-toggle, #win-mini, #arrows, #shuffle, #repeat, #progress span { display: none; }
        header { grid-template-columns: minmax(0, 1fr) auto; }
        /* The progress bar runs along the top edge of the bar, the title gets the room. */
        footer { position: relative; grid-template-columns: minmax(0, 1fr) auto auto; }
        #progress { position: absolute; left: 0; right: 0; top: -7px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

            <button id="side-toggle" class="head-btn" aria-expanded="true">
              <svg class="fold" viewBox="0 0 24 24"><path d="M17.59 18 19 16.59 14.42 12 19 7.41 17.59 6l-6 6zM11 18l1.41-1.41L7.83 12l4.58-4.59L11 6l-6 6z" /></svg>
              <svg class="unfold" viewBox="0 0 24 24"><path d="M6.41 6 5 7.41 9.58 12 5 16.59 6.41 18l6-6zM13 6l-1.41 1.41L16.17 12l-4.58 4.59L13 18l6-6z" /></svg>
            </button>
          </div>
          <div id="lib-chips" role="tablist" hidden></div>
          <div id="lib-tools" hidden>
            <div id="lib-filter-box">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" /></svg>
              <input id="lib-filter" type="text" spellcheck="false" autocomplete="off" data-ph="libFilterShort" data-aria="libFilter" />
            </div>
            <button id="lib-sort"><span></span><svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3zM3 6v2h18V6zm0 7h12v-2H3z" /></svg></button>
          </div>
          <div id="lib-note" hidden></div>
          <div id="lib-list"></div>
        </section>
      </aside>

      <main>
        <div id="sticky">
          <button id="sticky-play" class="bigplay" data-tip="playAll"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg></button>
          <b id="sticky-title"></b>
        </div>
        <div id="hero" hidden>
          <img id="hero-art" alt="" />
          <div id="hero-text">
            <div id="hero-type"></div>
            <h1 id="hero-title"></h1>
            <span id="hero-edition" hidden></span>
            <p id="hero-desc"></p>
            <div id="hero-meta"></div>
          </div>
        </div>
        <div id="inner">
          <h1 id="heading"></h1>
          <div id="chips" hidden></div>
          <div id="tabs" role="tablist" hidden></div>
          <div id="actions" hidden>
            <button id="play-all" class="bigplay" data-tip="playAll"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg></button>
            <button id="shuffle-all" class="act-btn" data-tip="shuffle">
              <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z" /></svg>
            </button>
            <button id="save-lib" class="act-btn" aria-pressed="false" hidden>
              <svg class="off" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m1-13h-2v4H7v2h4v4h2v-4h4v-2h-4z" /></svg>
              <svg class="on" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8z" /></svg>
            </button>
            <button id="subscribe" aria-pressed="false" hidden></button>
            <button id="page-more" class="act-btn" data-tip="more">
              <svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4m6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4" /></svg>
            </button>
            <div id="list-tools" hidden>
              <button id="list-find" class="act-btn" data-tip="filterList" style="width: 32px; height: 32px">
                <svg viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" /></svg>
              </button>
              <input id="list-filter" type="text" spellcheck="false" autocomplete="off" data-ph="filterList" data-aria="filterList" />
              <button id="list-sort"><span></span><svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3zM3 6v2h18V6zm0 7h12v-2H3z" /></svg></button>
            </div>
          </div>
          <p id="status"></p>
          <div id="list"></div>
          <div id="more"></div>
          <section id="about" hidden>
            <h2 class="shelf"></h2>
            <div class="about-card">
              <img alt="" />
              <div class="about-text"><b></b><p></p><button type="button"></button></div>
            </div>
          </section>
        </div>
      </main>

      <div id="stage" hidden>
        <div id="stage-top">
          <button id="stage-label"></button>
          <div id="av" role="group" data-title="avTip" hidden>
            <button id="av-song" data-t="avSong" aria-pressed="true"></button>
            <button id="av-video" data-t="avVideo" aria-pressed="false"></button>
          </div>
          <button id="stage-full" class="queue-icon" data-tip="fullscreen" data-key="F11">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z" /></svg>
          </button>
          <button id="stage-close" class="queue-icon" data-tip="closeStage">
            <svg viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z" /></svg>
          </button>
        </div>
        <div id="stage-body">
          <div id="stage-video"></div>
          <div id="stage-song">
            <img id="stage-art" alt="" />
            <div id="stage-title"></div>
            <div id="stage-artist"></div>
          </div>
          <div id="stage-lyrics"></div>
        </div>
      </div>

      <aside id="queue" class="panel" hidden>
        <div id="queue-head" role="tablist">
          <button id="tab-now" class="chip" role="tab" aria-selected="false" data-t="tabNow"></button>
          <button id="tab-queue" class="chip" role="tab" aria-selected="true" data-t="queue"></button>
          <button id="tab-lyrics" class="chip" role="tab" aria-selected="false" data-t="lyrics"></button>
          <button id="queue-save" class="queue-icon" data-tip="saveQueue">
            <svg viewBox="0 0 24 24"><path d="M14 10H3v2h11zm0-4H3v2h11zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2zM3 16h7v-2H3z" /></svg>
          </button>
          <button id="queue-close" class="queue-icon" data-tip="closeQueue">
            <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" /></svg>
          </button>
        </div>
        <div id="now-pane" role="tabpanel" hidden>
          <img id="np-art" alt="" />
          <div id="np-meta">
            <div class="text"><div id="np-title" data-t="nothing"></div><div id="np-artist" class="sub"></div></div>
            <button id="np-like" class="icon-btn" data-tip="like" aria-pressed="false">
              <svg class="off" viewBox="0 0 24 24"><path d="M21 8h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2c0-1.1-.9-2-2-2zm0 4-3 7H9V9l4.34-4.34L12.23 10H21zM1 9h4v12H1z" /></svg>
              <svg class="on" viewBox="0 0 24 24"><path d="M1 21h4V9H1zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73z" /></svg>
            </button>
            <button id="np-more" class="icon-btn" data-tip="more">
              <svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4m6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4" /></svg>
            </button>
          </div>
          <div id="np-next" hidden>
            <div id="np-next-head"><b data-t="queue"></b><button id="np-open-queue" data-t="openQueue"></button></div>
            <div id="np-next-row"></div>
          </div>
          <div id="np-artist-card" role="button" tabindex="0" hidden>
            <div class="ac-photo"><b></b></div>
            <div class="ac-foot"></div>
          </div>
        </div>
        <div id="queue-pane" role="tabpanel">
          <p id="queue-empty" data-t="queueEmpty" hidden></p>
          <div id="queue-list"></div>
        </div>
        <div id="lyrics-pane" role="tabpanel" hidden>
          <div id="lyrics"></div>
          <div id="lyrics-source"></div>
        </div>
      </aside>
      <div id="menu" role="menu" hidden></div>
      <div id="submenu" role="menu" hidden></div>
      <div id="toast" role="status" hidden></div>
      <div id="tip" role="tooltip" hidden></div>
      <dialog id="pl-dialog">
        <h2 data-t="addPlaylist"></h2>
        <p id="pl-status"></p>
        <div id="pl-list"></div>
        <button id="pl-create">
          <span class="pl-icon"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z" /></svg></span><span data-t="newPlaylist"></span>
        </button>
        <button id="pl-cancel" data-t="cancel"></button>
      </dialog>
      <dialog id="ask-dialog">
        <form method="dialog">
          <h2 id="ask-title"></h2>
          <input id="ask-input" maxlength="150" required />
          <div id="ask-buttons">
            <button value="ok" data-t="ok"></button>
            <button value="" formnovalidate data-t="cancel"></button>
          </div>
        </form>
      </dialog>
      <dialog id="keys-dialog">
        <h2><span data-t="setKeys"></span><kbd>Esc</kbd></h2>
        <div id="keys-cols"></div>
      </dialog>
      <dialog id="up-dialog">
        <h2 data-t="updateTitle"></h2>
        <p id="up-version"></p>
        <p id="up-text"></p>
        <progress id="up-bar" hidden></progress>
        <div id="up-actions">
          <button id="up-later" class="btn" data-t="updateLater"></button>
          <button id="up-install" class="btn primary" data-t="updateInstall" autofocus></button>
        </div>
      </dialog>
    </div>

    <footer>
      <div id="left">
        <div id="now">
          <button id="art-btn" data-tip="stage">
            <div id="art"></div>
            <svg viewBox="0 0 24 24"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z" /></svg>
          </button>
          <div id="meta">
            <div id="title" data-title="stage"><span id="title-text" data-t="nothing"></span></div>
            <div id="artist"></div>
          </div>
          <button id="like" class="icon-btn" data-tip="like" data-key="L" aria-pressed="false">
            <svg class="off" viewBox="0 0 24 24"><path d="M21 8h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2c0-1.1-.9-2-2-2zm0 4-3 7H9V9l4.34-4.34L12.23 10H21zM1 9h4v12H1z" /></svg>
            <svg class="on" viewBox="0 0 24 24"><path d="M1 21h4V9H1zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73z" /></svg>
          </button>
          <!-- Rated from the menu and the D key; kept for both and for its state. -->
          <button id="dislike" aria-pressed="false" hidden></button>
        </div>
        <button id="skip-ad" data-t="skipAd" hidden></button>
      </div>
      <div id="center">
        <div id="controls">
          <button id="shuffle" class="icon-btn toggle" data-tip="shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z" /></svg>
          </button>
          <button id="previous" class="icon-btn main" data-tip="previous" data-key="Shift+←">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
          </button>
          <button id="playpause" class="icon-btn" data-tip="playpause" data-key="Space">
            <svg class="when-paused" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            <svg class="when-playing" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
          </button>
          <button id="next" class="icon-btn main" data-tip="next" data-key="Shift+→">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" /></svg>
          </button>
          <button id="repeat" class="icon-btn toggle" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z" /></svg>
          </button>
        </div>
        <div id="progress">
          <span id="t-pos"></span>
          <div id="seekbar">
            <div id="rail"><div id="fill"></div></div>
            <div id="glide"></div>
            <input id="seek" type="range" min="0" max="1" step="1" value="0" data-aria="seek" disabled />
            <div id="seek-tip" hidden></div>
          </div>
          <span id="t-dur"></span>
        </div>
      </div>
      <div id="right">
        <button id="lyrics-toggle" class="icon-btn" data-tip="lyrics" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v12H5.17L4 17.17V4m0-2c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm2 10h8v2H6zm0-3h12v2H6zm0-3h12v2H6z" /></svg>
        </button>
        <button id="queue-toggle" class="icon-btn" data-tip="queue" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4v8l6-4z" /></svg>
        </button>
        <button id="win-mini" class="icon-btn" data-tip="mini">
          <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2m-2 .02H3V4.97h18z" /></svg>
        </button>
        <button id="mute" class="icon-btn" data-tip="mute" data-key="M" data-level="3">
          <svg class="v0" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9zM12 4 9.91 6.09 12 8.18z" /></svg>
          <svg class="v1" viewBox="0 0 24 24"><path d="M7 9v6h4l5 5V4l-5 5z" /></svg>
          <svg class="v2" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9z" /></svg>
          <svg class="v3" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" /></svg>
        </button>
        <input id="volume" type="range" min="0" max="100" value="100" data-tip="volume" />
        <button id="stage-toggle" class="icon-btn" data-tip="stage" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z" /></svg>
        </button>
      </div>
    </footer>
    <!-- Classic scripts sharing one global scope, in dependency order; app.js wires them up last. -->
    <script src="base.js"></script>
    <script src="strings.js"></script>
    <script src="lists.js"></script>
    <script src="library.js"></script>
    <script src="search.js"></script>
    <script src="player.js"></script>
    <script src="panel.js"></script>
    <script src="settings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
